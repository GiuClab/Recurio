name: Publish verified Android preview
on:
  push:
    branches: [main]
    paths: [distribution/preview.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-verification
          path: app/build/reports/
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the locally verified, compatible signed preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          filename=$(jq -r .filename distribution/preview.json)
          blob=$(jq -r .blob_sha distribution/preview.json)
          expected=$(jq -r .sha256 distribution/preview.json)
          [[ "$filename" =~ ^Recurio-[A-Za-z0-9.-]+\.apk$ ]]
          [[ "$blob" =~ ^[a-f0-9]{40}$ ]]
          [[ "$expected" =~ ^[a-f0-9]{64}$ ]]
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/git/blobs/$blob" > "$filename"
          printf '%s  %s\n' "$expected" "$filename" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          unzip -t "$filename" > /dev/null
      - name: Publish the alpha APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          filename=$(jq -r .filename distribution/preview.json)
          tag=$(jq -r .tag distribution/preview.json)
          version=$(jq -r .version distribution/preview.json)
          if gh release view "$tag" > /dev/null 2>&1; then
            mkdir -p existing
            gh release download "$tag" --pattern "$filename" --dir existing
            cmp "$filename" "existing/$filename"
            echo 'The same verified preview is already published.'
          else
            gh release create "$tag" "$filename" SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "Recurio $version — Android preview" --notes-file distribution/RELEASE_NOTES.md
          fi
