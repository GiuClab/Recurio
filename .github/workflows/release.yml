name: Build stable release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore production signing key
        env:
          KEYSTORE: ${{ secrets.RECURIO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RECURIO_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RECURIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RECURIO_KEY_PASSWORD }}
          CERTIFICATE: ${{ vars.RECURIO_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" && test -n "$CERTIFICATE"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/recurio-release.jks"
      - name: Check and build signed release
        env:
          RECURIO_KEYSTORE_PATH: ${{ runner.temp }}/recurio-release.jks
          RECURIO_STORE_PASSWORD: ${{ secrets.RECURIO_STORE_PASSWORD }}
          RECURIO_KEY_ALIAS: ${{ secrets.RECURIO_KEY_ALIAS }}
          RECURIO_KEY_PASSWORD: ${{ secrets.RECURIO_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug lintRelease assembleRelease --no-daemon
      - name: Verify certificate and package
        env:
          EXPECTED_CERT: ${{ vars.RECURIO_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/certificate.txt"
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/certificate.txt" | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$EXPECTED_CERT" | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          test "$actual" = "$expected"
          version=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p release
          cp "$apk" "release/Recurio-$version.apk"
          cd release
          sha256sum "Recurio-$version.apk" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Recurio-stable-release
          path: release/
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/recurio-release.jks"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification
          path: app/build/reports/
