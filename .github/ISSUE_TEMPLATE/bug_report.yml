name: Bug report / Segnala un problema
description: Report an issue in English, Italiano, Deutsch or Français.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include backup passwords, private subscription URLs or personal payment details. Non inserire password, link privati o dati dei pagamenti."
  - type: input
    id: version
    attributes:
      label: Recurio version / Versione
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Phone model and Android version / Modello e versione Android
  - type: textarea
    id: behavior
    attributes:
      label: What happened and what did you expect? / Cosa succede e cosa ti aspettavi?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Passaggi per riprodurre
